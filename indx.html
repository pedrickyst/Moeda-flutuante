<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moeda 3D Personalizada</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #121212; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }
        canvas { 
            display: block; 
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #loading {
            z-index: 2;
            font-size: 1.2rem;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <!-- Texto de carregamento enquanto as imagens da moeda são baixadas -->
    <div id="loading">Forjando moeda...</div>

    <!-- Importando a biblioteca Three.js diretamente via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        // 1. Configuração da Cena, Câmera e Renderizador
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 12; // Afasta a câmera para ver a moeda inteira

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        // Ajusta a resolução para telas de alta qualidade (como retina displays)
        renderer.setPixelRatio(window.devicePixelRatio); 
        document.body.appendChild(renderer.domElement);

        // 2. Iluminação para destacar o relevo e o metal
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(10, 10, 15);
        scene.add(directionalLight);

        // Luz de preenchimento para dar reflexo do outro lado
        const backLight = new THREE.DirectionalLight(0xffffff, 0.5);
        backLight.position.set(-10, -10, -15);
        scene.add(backLight);

        // 3. Geometria da Moeda (Cilindro achatado)
        const geometry = new THREE.CylinderGeometry(5, 5, 0.4, 64);

        // 4. Carregamento de Texturas
        const textureLoader = new THREE.TextureLoader();
        let texturesLoaded = 0;

        // Função para remover o texto "Forjando moeda..." quando as imagens carregarem
        function checkLoad() {
            texturesLoaded++;
            if (texturesLoaded === 2) {
                document.getElementById('loading').style.display = 'none';
            }
        }

        // ATENÇÃO: As imagens devem estar na mesma pasta do arquivo HTML com estes exatos nomes
        const frontTexture = textureLoader.load('frente.jpg', checkLoad);
        const backTexture = textureLoader.load('verso.jpg', checkLoad);

        // 5. Materiais (Borda, Frente, Verso)
        const edgeMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x6b5335, // Bronze envelhecido
            metalness: 0.9, 
            roughness: 0.4 
        });

        const frontMaterial = new THREE.MeshStandardMaterial({ 
            map: frontTexture, 
            metalness: 0.3, 
            roughness: 0.6 
        });

        const backMaterial = new THREE.MeshStandardMaterial({ 
            map: backTexture, 
            metalness: 0.3, 
            roughness: 0.6 
        });

        // O array define a ordem de aplicação no cilindro: [lateral, topo(frente), base(verso)]
        const materials = [edgeMaterial, frontMaterial, backMaterial];

        // 6. Criando a malha final e adicionando à cena
        const coin = new THREE.Mesh(geometry, materials);
        coin.rotation.x = Math.PI / 2; // Deixa a moeda "em pé" virada para a câmera
        scene.add(coin);

        // 7. Loop de Animação
        function animate() {
            requestAnimationFrame(animate);

            // Gira a moeda no próprio eixo
            coin.rotation.z -= 0.015; 
            
            // Adiciona uma leve oscilação (wobble) para o 3D ficar mais evidente
            coin.rotation.x = (Math.PI / 2) + Math.sin(Date.now() * 0.001) * 0.1;

            renderer.render(scene, camera);
        }

        animate();

        // 8. Responsividade: Ajusta o tamanho se a janela for redimensionada
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
